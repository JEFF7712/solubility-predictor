name: Deploy to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jeff7712/solubility-gnn

jobs:
  build-and-push:
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Local Registry
        uses: docker/login-action@v4
        with:
          registry: registry.rupan.dev
          username: publisher-solubility-gnn
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: version
        run: echo "tag=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: config/Dockerfile
          push: true
          tags: |
            registry.rupan.dev/apps/solubility-gnn:${{ steps.version.outputs.tag }}
            registry.rupan.dev/apps/solubility-gnn:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
